<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聯機桌遊</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#172033}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:24px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px #0000000b}
h1,h2,h3{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
input,select,button,textarea{font:inherit}input,select,textarea{padding:10px 12px;border:1px solid #ccd2da;border-radius:10px;width:100%}button{padding:10px 14px;border:0;border-radius:10px;background:#e8ecf1;cursor:pointer;font-weight:700}button.primary{background:#1f2937;color:#fff}button.good{background:#dff7e7}button.warn{background:#fff0d5}
button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.muted{color:#6b7280}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;margin:2px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.player{padding:10px;border:1px solid #e3e7ed;border-radius:10px}.host{border-color:#9cc2ff}
.option{min-height:72px;text-align:left;font-size:17px}.selected{outline:3px solid #94bfff}.winner{background:#d9fbe3}
.timer{font-size:30px;font-weight:800}.chat{border:1px solid #e1e6ec;border-radius:12px;padding:10px;height:300px;overflow:auto;background:#fafbfc}.msg{margin-bottom:9px}.me{font-weight:700}
.bar{height:10px;background:#e9edf2;border-radius:999px;overflow:hidden}.fill{height:100%;background:#4f8cff}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎲 聯機桌遊</h1>
    <p class="muted">無需註冊。輸入暱稱、建立或加入房間即可遊玩。</p>
  </div>

  <section id="lobby" class="card">
    <h2>建立 / 加入房間</h2>
    <div class="grid grid2">
      <div><label>暱稱</label><input id="nickname" maxlength="20" placeholder="例如：小明"></div>
      <div><label>房間號</label><input id="roomCode" maxlength="6" placeholder="建立後會自動生成"></div>
    </div>
    <div style="height:12px"></div>
    <div class="row">
      <button id="create1" class="primary">建立：心有靈犀一點通</button>
      <button id="create2" class="primary">建立：9upper瞎掰王</button>
      <button id="join">加入房間</button>
    </div>
    <p id="error" style="color:#c62828"></p>
  </section>

  <section id="roomCard" class="card hidden">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><h2>房間 <span id="roomLabel"></span></h2><div id="gameLabel" class="muted"></div></div>
      <button id="startGame" class="primary">房主開始遊戲</button>
    </div>
    <p>人數：<span id="count"></span>（每局需要 4-6 人）</p>
    <div id="players" class="players"></div>
    <hr>
    <h3>題庫分類篩選</h3>
    <div id="filters" class="row"></div>
  </section>

  <section id="gameCard" class="card hidden">
    <div id="game"></div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const $=s=>document.querySelector(s);
let room=null, gameState=null, myRole=null, myExplanation=null, selectedFilters=[];

async function loadQuestions(){
  const r=await fetch("/questions.json"); return r.json();
}
let qdata=null;

async function init(){ qdata=await loadQuestions(); }
init();

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showErr(t){$("#error").textContent=t||"";}

function create(game){ showErr(""); socket.emit("room:create",{nickname:$("#nickname").value.trim(),game,filters:{categories:selectedFilters}}); }
$("#create1").onclick=()=>create("game1"); $("#create2").onclick=()=>create("game2");
$("#join").onclick=()=>socket.emit("room:join",{nickname:$("#nickname").value.trim(),code:$("#roomCode").value.trim()});

socket.on("server:error",d=>showErr(d.message));
socket.on("room:created",d=>{$("#roomCode").value=d.code;});
socket.on("room:joined",d=>{});
socket.on("room:update",d=>{room=d; renderRoom();});

function renderRoom(){
  $("#lobby").classList.add("hidden"); $("#roomCard").classList.remove("hidden");
  $("#gameCard").classList.toggle("hidden",room.state?.phase==="waiting");
  $("#roomLabel").textContent=room.code;
  $("#gameLabel").textContent=room.game==="game1"?"心有靈犀一點通":"9upper瞎掰王";
  $("#count").textContent=room.players.length;
  $("#players").innerHTML=room.players.map(p=>`<div class="player ${p.id===room.hostId?'host':''}"><b>${esc(p.nickname)}</b><br><span class="muted">${p.id===room.hostId?'房主':''}</span></div>`).join("");
  const cats=room.game==="game1"?qdata.game1.categories:qdata.game2.categories;
  $("#filters").innerHTML=cats.map(c=>`<label class="pill"><input type="checkbox" value="${esc(c)}" ${selectedFilters.length===0||selectedFilters.includes(c)?"checked":""}> ${esc(c)}</label>`).join("");
  $("#filters").querySelectorAll("input").forEach(x=>x.onchange=()=>{
    selectedFilters=[...$("#filters").querySelectorAll("input:checked")].map(i=>i.value);
  });
  $("#startGame").classList.toggle("hidden",socket.id!==room.hostId || room.state?.phase!=="waiting");
}
$("#startGame").onclick=()=>socket.emit("room:start",{filters:{categories:selectedFilters}});

socket.on("game1:voteOpen",s=>{gameState=s;renderGame1();});
socket.on("game1:chatOpen",s=>{gameState=s;renderGame1();});
socket.on("game1:chatMessage",m=>appendChat("g1Chat",m));
socket.on("chat:clear",()=>{const el=$("#g2Chat");if(el)el.innerHTML=""});
socket.on("game2:private",d=>{myRole=d.role; myExplanation=d.explanation||null; renderGame2Public();});
socket.on("game2:chatMessage",m=>appendChat("g2Chat",m));
socket.on("game:state",s=>{gameState=s;});
socket.on("room:update",s=>{if(s.state?.phase && s.state.phase!=="waiting"){gameState=s.state; if(s.game==="game1")renderGame1(); else renderGame2Public();}});

function countdown(el,endsAt){
  const tick=()=>{const ms=Math.max(0,(endsAt||0)-Date.now());el.textContent=(ms/1000).toFixed(1)+"s"; if(ms>0)setTimeout(tick,100);else el.textContent="0.0s";}; tick();
}

function renderGame1(){
  if(!gameState)return;
  const q=gameState.question;
  if(gameState.phase==="vote"){
    $("#game").innerHTML=`
      <div class="row" style="justify-content:space-between"><h2>🧠 心有靈犀一點通 · 第${gameState.round}題</h2><div id="timer" class="timer"></div></div>
      <div class="muted">每人一票，10秒後自動鎖定。</div>
      <h3 style="margin-top:20px">${esc(q.question)}</h3>
      <div class="grid grid2">
        ${q.options.map((x,i)=>`<button class="option" onclick="vote(${i})">${esc(x)}</button>`).join("")}
      </div>
      <p>目前票數：<span class="pill">A ${gameState.votes[0]}</span><span class="pill">B ${gameState.votes[1]}</span>　已投 ${gameState.submittedCount}/${gameState.playerCount}</p>`;
    countdown($("#timer"),gameState.endsAt);
  }else{
    $("#game").innerHTML=`
      <div class="row" style="justify-content:space-between"><h2>💬 投票結果 · 第${gameState.round}題</h2><div class="pill">聊天不限時</div></div>
      <h3>${esc(q.question)}</h3>
      <div class="grid grid2">
        ${q.options.map((x,i)=>`<div class="card ${gameState.winner===i?'winner':''}" style="margin:0"><b>${String.fromCharCode(65+i)}. ${esc(x)}</b><div style="margin-top:8px">${gameState.votes[i]} 票 ${gameState.winner===i?'🏆':''}</div></div>`).join("")}
      </div>
      <div style="height:12px"></div>
      <div id="g1Chat" class="chat"></div>
      <div class="row" style="margin-top:10px"><input id="g1Input" placeholder="說說你的想法…"><button onclick="sendChat1()">發送</button><button class="good" onclick="next1()">下一題</button></div>
      <p class="muted">已準備下一題：${gameState.nextReadyCount}/${room.players.length}</p>`;
  }
}
window.vote=i=>socket.emit("game1:vote",{option:i});
window.sendChat1=()=>{const x=$("#g1Input");socket.emit("game1:chat",{text:x.value});x.value=""};
window.next1=()=>socket.emit("game1:next");


function renderGame2Public(){
  if(!room?.state || !room.state.phase || room.game!=="game2") return;
  const s=room.state;
  const roleText=myRole==="judge"?"法官（公開）":myRole==="truth"?"知情人":"騙子";
  let html=`<div class="row" style="justify-content:space-between"><h2>🎭 9upper瞎掰王</h2><div id="timer" class="timer"></div></div>
  <div id="privateRole" class="card" style="margin:0 0 12px"><b>你的身份：</b>${roleText}${myExplanation?`<div style="margin-top:8px"><b>正確解釋：</b>${esc(myExplanation)}</div>`:""}</div>
  <p>術語：<b>${esc(s.term)}</b></p>`;
  if(s.phase==="prep")html+=`<div class="card">準備階段：30秒內不能發言，記住你的身份與任務。</div>`;
  if(s.phase==="speaking")html+=`<p>目前發言：<b>${esc((room.players.find(p=>p.id===s.currentPlayerId)||{}).nickname||"")}</b></p>
    <div id="g2Chat" class="chat"></div><div class="row" style="margin-top:10px"><input id="g2Input" placeholder="${s.currentPlayerId===socket.id?'現在輪到你，輸入解釋…':'等待當前玩家發言…'}" ${s.currentPlayerId===socket.id?'':'disabled'}><button onclick="sendChat2()" ${s.currentPlayerId===socket.id?'':'disabled'}>發送</button></div>`;
  if(s.phase==="judge")html+=`<div class="card"><b>法官請選擇你認為的知情人：</b><div class="grid grid2" style="margin-top:10px">${s.choices.map(p=>`<button onclick="judge(${JSON.stringify(p.id)})">${esc(p.nickname)}</button>`).join("")}</div></div>`;
  if(s.phase==="result"){ const truth=room.players.find(p=>p.id===s.truthId)?.nickname||""; html+=`<div class="card"><h3>${s.correct?'✅ 法官猜中':'❌ 法官猜錯'}</h3><p>真正的直言者：<b>${esc(truth)}</b></p></div>`; }
  $("#game").innerHTML=html; if(s.endsAt)countdown($("#timer"),s.endsAt);
}
window.sendChat2=()=>{const x=$("#g2Input");socket.emit("game2:chat",{text:x.value});x.value=""};
window.judge=id=>socket.emit("game2:judge",{targetId:id});

function renderGame2(){renderGame2Public()}

function appendChat(id,m){
  const el=$("#"+id); if(!el)return;
  const me=m.playerId===socket.id;
  const row=document.createElement("div"); row.className="msg";
  row.innerHTML=`<span class="me">${esc(m.nickname)}</span>：${esc(m.text)}`;
  el.appendChild(row); el.scrollTop=el.scrollHeight;
}
</script>
</body>
</html>
